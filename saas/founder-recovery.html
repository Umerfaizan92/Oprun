<!doctype html>
<html lang="en" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Founder recovery — Super Pro AI Office Manager</title><link rel="stylesheet" href="app.css?v=20261028.6"><link rel="stylesheet" href="auth.css?v=20261024"><script defer src="founder-recovery.js?v=20261109.1"></script></head>
<body class="auth-page"><main class="auth-layout"><section class="auth-story"><a class="brand" href="/">Super Pro AI Office Manager</a><div class="auth-story-copy"><h1>Founder account recovery</h1><p>Approve temporary verification for your existing linked Founder account. Approval expires after 24 hours. Your password, email code and existing authenticator remain required.</p></div></section>
<section class="auth-form-side"><div class="auth-form-card"><a href="operator-sign-in.html">← Operator sign-in</a><h2>Authenticate recovery approval</h2>
<form id="founder-recovery-login" class="registration-grid"><label>Founder admin key<input name="key" type="password" autocomplete="current-password" required></label><label>Authenticator code<input name="code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="one-time-code" required></label><button class="primary-button" type="submit">Verify founder credentials</button></form>
<form id="founder-recovery-approval" class="registration-grid" hidden><p id="founder-recovery-account"></p><label>Recovery reason<textarea name="reason" minlength="10" maxlength="500" required>Temporary recovery due to Telnyx billing interruption</textarea></label><label class="remember-row"><input name="confirm" type="checkbox" required><span>I confirm this is my linked Founder account and authorise temporary recovery.</span></label><button class="primary-button" type="submit">Approve recovery for 24 hours</button></form>
<p id="founder-recovery-message" class="auth-message" role="status"></p></div></section></main></body></html>
