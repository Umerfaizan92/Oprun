name: Oprun
options:
  bundleIdPrefix: ai.oprun
  deploymentTarget:
    iOS: '16.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    MARKETING_VERSION: '1.0.0'
    CURRENT_PROJECT_VERSION: '1'
    DEVELOPMENT_TEAM: $(OPRUN_APPLE_TEAM_ID)
    CODE_SIGN_STYLE: Automatic
targets:
  Oprun:
    type: application
    platform: iOS
    sources:
      - Oprun
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.oprun.app
        INFOPLIST_FILE: Oprun/Info.plist
        CODE_SIGN_ENTITLEMENTS: Oprun/Oprun.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: '1,2'
    scheme:
      testTargets: []
      gatherCoverageData: false
